# GP prior with a hyperprior: every dataset (sequence) of every batch gets its own hyperparameters.
# Each hyperparameter is a fixed number or {dist: uniform | log_uniform, low: a, high: b}.
# All settings are listed (defaults and constraints: src/config.py); print the resolved config with
#   python -m src.train --config configs/gp_hyperprior.yaml --print_config
prior:
  num_features: 1
  equidistant_x: false  # true = x on an equidistant grid in [0, 1]; requires num_features == 1
  device: null  # device for sampling the prior; null = default device (use cpu if MPS is unstable)
  hyperparameters:
    # Kernel: bias + variance * x^T x' + rbf_outputscale * RBF(rbf_lengthscale)
    #         + periodic_outputscale * ExpSineSquared(period, periodic_lengthscale) [* RBF(periodic_decay)]
    noise: { dist: log_uniform, low: 1.e-4, high: 0.1 }  # observation noise variance; > 0
    variance: { dist: log_uniform, low: 0.1, high: 10.0 }  # linear (dot-product) part; >= 0
    rbf_outputscale: { dist: uniform, low: 0.0, high: 1.0 }  # 0 = no RBF part
    rbf_lengthscale: { dist: log_uniform, low: 0.05, high: 1.0 }  # > 0 if rbf_outputscale can be > 0
    bias: { dist: uniform, low: 0.0, high: 1.0 }  # constant offset (intercept variance); 0 = none
    periodic_outputscale: 0.0  # 0 = no periodic part
    period: null  # > 0 if periodic_outputscale can be > 0
    periodic_lengthscale: null  # smoothness within a period; > 0 if periodic_outputscale can be > 0
    periodic_decay: null  # lengthscale of the RBF factor (locally periodic); null = exactly periodic

model:
  emsize: 128  # must be divisible by nhead
  nhid: 256  # null = 2 * emsize
  nlayers: 4
  nhead: 4
  dropout: 0.0  # in [0, 1)
  input_normalization: false
  min_var: 1.e-6  # lower bound of the predicted variance

training:
  bptt: 12  # sequence length (training + query points) of each sampled dataset; >= 2
  epochs: 50
  steps_per_epoch: 100  # must be divisible by optim.aggregate_k_gradients
  batch_size: 500
  max_eval_pos: null  # single_eval_pos is sampled from range(max_eval_pos); null = bptt
  eval_pos_sampling: weighted  # weighted | uniform
  seed: null  # null = random seed (chosen and recorded by train)
  device: null  # device for the model; null = default device (CUDA, MPS, then CPU)

optim:
  lr: 0.0003  # null = get_openai_lr(model)
  warmup_epochs: 5
  aggregate_k_gradients: 1
